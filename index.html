<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DM Companion</title>
  <meta name="description" content="A tool for D&amp;D 2024 Dungeon Masters: combat, compendium, campaign and ambience.">
  <meta name="theme-color" content="#1a2130">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>

  <div class="app">
    <header class="topbar">
      <h1 class="brand">DM Companion</h1>
      <nav class="tabs" data-i18n-aria="nav.panels" aria-label="Panels">
        <a class="tab" href="#combate" data-panel="combate"><svg class="icon" aria-hidden="true"><use href="#i-swords"/></svg><span data-i18n="tab.combat">Combat</span><kbd>1</kbd></a>
        <a class="tab" href="#compendio" data-panel="compendio"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span data-i18n="tab.compendium">Compendium</span><kbd>2</kbd></a>
        <a class="tab" href="#campana" data-panel="campana"><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg><span data-i18n="tab.campaign">Campaign</span><kbd>3</kbd></a>
        <a class="tab" href="#ambientacion" data-panel="ambientacion"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg><span data-i18n="tab.ambience">Ambience</span><kbd>4</kbd></a>
      </nav>
      <button class="btn btn-ghost clock-chip" id="btn-clock" type="button"></button>
      <button class="btn btn-ghost" id="btn-settings" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg><span class="settings-label" data-i18n="btn.settings">Settings</span>
      </button>
    </header>

    <main class="panels">
      <!-- PANEL 1: COMBAT -->
      <section class="panel" id="panel-combate" data-panel="combate" data-i18n-aria="combat.aria" aria-label="Combat">
        <div class="combat-toolbar">
          <div class="round-box" aria-live="polite">
            <span class="round-label" data-i18n="combat.round">Round</span>
            <span class="round-num num" id="round-num">—</span>
          </div>
          <button class="btn" id="btn-add" type="button"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="combat.add">Add</span></button>
          <button class="btn" id="btn-undo" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg><span data-i18n="combat.undo">Undo</span></button>
          <button class="btn btn-icon" id="btn-combat-menu" type="button" data-i18n-aria="combat.options" aria-label="Combat options"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
          <div class="spacer"></div>
          <button class="btn btn-lg" id="btn-prev" type="button"><svg class="icon" aria-hidden="true"><use href="#i-left"/></svg><span data-i18n="combat.prev">Previous</span></button>
          <button class="btn btn-lg btn-primary" id="btn-next" type="button"><span>Next turn</span><svg class="icon" aria-hidden="true"><use href="#i-right"/></svg></button>
        </div>
        <div class="combat-body">
          <div class="board-wrap" id="board-wrap">
            <div class="board" id="board" data-i18n-aria="combat.grid" aria-label="Combat grid"></div>
          </div>
          <aside class="turn-list" id="turn-list" data-i18n-aria="combat.order" aria-label="Initiative order"></aside>
        </div>
      </section>

      <!-- FUTURE PANELS (built in phases 2, 3 and 4) -->
      <!-- PANEL 2: COMPENDIUM -->
      <section class="panel" id="panel-compendio" data-panel="compendio" data-i18n-aria="tab.compendium" hidden>
        <div class="comp">
          <div class="comp-side">
            <div class="segmented" id="comp-kinds" role="radiogroup" data-i18n-aria="tab.compendium">
              <label class="seg"><input type="radio" name="comp-kind" value="monster" checked><span data-i18n="comp.monsters">Monsters</span></label>
              <label class="seg"><input type="radio" name="comp-kind" value="spell"><span data-i18n="comp.spells">Spells</span></label>
              <label class="seg"><input type="radio" name="comp-kind" value="rule"><span data-i18n="comp.rules">Rules</span></label>
            </div>
            <input type="search" id="comp-search" autocomplete="off" spellcheck="false" data-i18n-aria="comp.searchAria">
            <details class="comp-filter-box">
              <summary><svg class="icon" aria-hidden="true"><use href="#i-flag"/></svg><span data-i18n="comp.filters">Filters</span><span class="badge" id="comp-filter-count" hidden></span></summary>
              <div class="comp-filters" id="comp-filters"></div>
            </details>
            <div class="comp-bar">
              <span class="hint num" id="comp-count" aria-live="polite"></span>
              <button class="btn" type="button" id="comp-new"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="comp.new">New</span></button>
            </div>
            <ul class="comp-list" id="comp-list"></ul>
          </div>
          <article class="comp-detail" id="comp-detail"></article>
        </div>
      </section>
      <!-- PANEL 3: CAMPAIGN -->
      <section class="panel" id="panel-campana" data-panel="campana" data-i18n-aria="tab.campaign" hidden>
        <div class="camp">
          <div class="camp-bar">
            <div class="segmented seg-5" id="camp-views" role="radiogroup" data-i18n-aria="tab.campaign">
              <label class="seg"><input type="radio" name="camp-view" value="sessions" checked><span><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg> <span data-i18n="camp.sessions">Sessions</span></span></label>
              <label class="seg"><input type="radio" name="camp-view" value="codex"><span><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg> <span data-i18n="camp.codex">Codex</span></span></label>
              <label class="seg"><input type="radio" name="camp-view" value="storylines"><span><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg> <span data-i18n="camp.storylines">Storylines</span></span></label>
              <label class="seg"><input type="radio" name="camp-view" value="map"><span><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg> <span data-i18n="camp.map">Map</span></span></label>
              <label class="seg"><input type="radio" name="camp-view" value="time"><span><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> <span data-i18n="clock.view">Time</span></span></label>
            </div>
            <input type="search" id="camp-search" autocomplete="off" data-i18n-placeholder="camp.searchAll" data-i18n-aria="camp.searchAll">
            <span class="camp-saved hint" id="camp-saved" aria-live="polite" hidden></span>
          </div>
          <div class="camp-body" id="camp-body"></div>
          <div class="camp-results" id="camp-results" hidden></div>
        </div>
      </section>
      <section class="panel" id="panel-ambientacion" data-panel="ambientacion" data-i18n-aria="tab.ambience" hidden>
        <div class="amb-root" id="amb-root"></div>
      </section>
    </main>
  </div>

  <!-- DIALOG: add combatant -->
  <dialog class="dialog" id="dlg-add" aria-labelledby="dlg-add-title">
    <form class="dialog-body" id="form-add" autocomplete="off">
      <header class="dialog-head">
        <h2 id="dlg-add-title" data-i18n="add.title">Add combatant</h2>
        <button class="btn btn-icon" type="button" data-close data-i18n-aria="common.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="field field-wide">
        <label for="add-name" data-i18n="add.name">Name</label>
        <input id="add-name" name="name" required maxlength="40" data-i18n-placeholder="add.namePlaceholder"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="monster-suggest" spellcheck="false">
        <ul class="suggest" id="monster-suggest" role="listbox" data-i18n-aria="add.suggestions" hidden></ul>
        <input type="hidden" name="ref">
      </div>
      <fieldset class="field field-wide">
        <legend data-i18n="add.faction">Faction</legend>
        <div class="segmented" role="radiogroup">
          <label class="seg seg-ally"><input type="radio" name="faction" value="ally"><span data-i18n="faction.ally">Ally</span></label>
          <label class="seg seg-enemy"><input type="radio" name="faction" value="enemy" checked><span data-i18n="faction.enemy">Enemy</span></label>
          <label class="seg seg-neutral"><input type="radio" name="faction" value="neutral"><span data-i18n="faction.neutral">Neutral</span></label>
        </div>
      </fieldset>
      <div class="field-row">
        <label class="field"><span data-i18n="term.init">Initiative</span><input name="init" type="number" required min="-10" max="50" step="1"></label>
        <label class="field"><span data-i18n="field.hpMax">Max HP</span><input name="hpMax" type="number" inputmode="numeric" required min="1" max="9999" step="1"></label>
        <label class="field"><span data-i18n="term.ac">AC</span><input name="ac" type="number" inputmode="numeric" required min="0" max="40" step="1"></label>
        <label class="field"><span data-i18n="add.count">Quantity</span><input name="count" type="number" inputmode="numeric" min="1" max="20" step="1" value="1"></label>
      </div>
      <p class="hint" id="add-hint" aria-live="polite" hidden></p>
      <footer class="dialog-foot">
        <button class="btn" type="submit" value="more" data-i18n="add.more">Add &amp; continue</button>
        <button class="btn btn-primary" type="submit" value="close" data-i18n="add.submit">Add</button>
      </footer>
    </form>
  </dialog>

  <!-- DIALOG: damage / healing -->
  <dialog class="dialog dialog-hp" id="dlg-hp" aria-labelledby="dlg-hp-title">
    <div class="dialog-body">
      <header class="dialog-head">
        <div>
          <h2 id="dlg-hp-title">—</h2>
          <p class="hp-status num" id="hp-status"></p>
        </div>
        <button class="btn btn-icon" type="button" data-close data-i18n-aria="common.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="quick" id="hp-quick"></div>
      <div class="hp-entry">
        <input class="hp-amount num" id="hp-amount" inputmode="none" autocomplete="off" data-i18n-aria="hp.amount" placeholder="0" maxlength="4" autofocus>
        <div class="keypad" id="hp-keypad">
          <button type="button" class="key" data-k="7">7</button><button type="button" class="key" data-k="8">8</button><button type="button" class="key" data-k="9">9</button>
          <button type="button" class="key" data-k="4">4</button><button type="button" class="key" data-k="5">5</button><button type="button" class="key" data-k="6">6</button>
          <button type="button" class="key" data-k="1">1</button><button type="button" class="key" data-k="2">2</button><button type="button" class="key" data-k="3">3</button>
          <button type="button" class="key" data-k="C" data-i18n-aria="hp.clearAll">C</button><button type="button" class="key" data-k="0">0</button>
          <button type="button" class="key" data-k="back" data-i18n-aria="hp.backspace"><svg class="icon" aria-hidden="true"><use href="#i-backspace"/></svg></button>
        </div>
      </div>
      <div class="hp-actions">
        <button type="button" class="btn btn-lg btn-damage" data-hp="damage" data-i18n="hp.damage">Damage</button>
        <button type="button" class="btn btn-lg btn-heal" data-hp="heal" data-i18n="hp.heal">Heal</button>
        <button type="button" class="btn btn-lg btn-temp" data-hp="temp" data-i18n="hp.temp">Temp HP</button>
      </div>
    </div>
  </dialog>

  <!-- DIALOG: combatant details (conditions, editing) -->
  <dialog class="dialog dialog-wide" id="dlg-detail" aria-labelledby="dlg-detail-title">
    <div class="dialog-body" id="detail-body"></div>
  </dialog>

  <!-- DIALOG: own compendium entry (new / edit) -->
  <dialog class="dialog dialog-wide" id="dlg-entry" aria-labelledby="dlg-entry-title">
    <form class="dialog-body" id="entry-body" autocomplete="off"></form>
  </dialog>

  <!-- DIALOG: stat block from the compendium (opened from Combat) -->
  <dialog class="dialog dialog-wide" id="dlg-statblock" aria-labelledby="dlg-statblock-title">
    <div class="dialog-body">
      <header class="dialog-head">
        <h2 id="dlg-statblock-title"></h2>
        <button class="btn btn-icon" type="button" data-close data-i18n-aria="common.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <div class="statblock" id="statblock-body" lang="en"></div>
    </div>
  </dialog>

  <!-- DIALOG: storyline -->
  <dialog class="dialog" id="dlg-story" aria-labelledby="dlg-story-title">
    <div class="dialog-body" id="story-body"></div>
  </dialog>

  <!-- DIALOG: import session notes -->
  <dialog class="dialog dialog-wide" id="dlg-import" aria-labelledby="dlg-import-title">
    <div class="dialog-body" id="import-body"></div>
  </dialog>

  <!-- DIALOG: game clock -->
  <dialog class="dialog" id="dlg-clock" aria-labelledby="dlg-clock-title">
    <div class="dialog-body" id="clock-body"></div>
  </dialog>

  <!-- DIALOG: detect characters and places in the notes -->
  <dialog class="dialog dialog-wide" id="dlg-detect" aria-labelledby="dlg-detect-title">
    <div class="dialog-body" id="detect-body"></div>
  </dialog>

  <!-- DIALOG: AI analysis of the session notes -->
  <dialog class="dialog dialog-wide" id="dlg-ai" aria-labelledby="dlg-ai-title">
    <div class="dialog-body" id="ai-body"></div>
  </dialog>

  <!-- DIALOG: combat options -->
  <dialog class="dialog" id="dlg-combat-menu" aria-labelledby="dlg-combat-menu-title">
    <form class="dialog-body" id="form-grid" autocomplete="off">
      <header class="dialog-head">
        <h2 id="dlg-combat-menu-title" data-i18n="combat.options">Combat options</h2>
        <button class="btn btn-icon" type="button" data-close data-i18n-aria="common.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <h3 data-i18n="menu.gridSize">Grid size</h3>
      <div class="field-row">
        <label class="field"><span data-i18n="menu.cols">Columns</span><input name="cols" type="number" inputmode="numeric" min="4" max="60" required></label>
        <label class="field"><span data-i18n="menu.rows">Rows</span><input name="rows" type="number" inputmode="numeric" min="4" max="40" required></label>
        <div class="field field-end"><button class="btn" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg><span data-i18n="common.apply">Apply</span></button></div>
      </div>
      <h3 data-i18n="menu.newCombat">New combat</h3>
      <div class="stack">
        <button class="btn" type="button" id="btn-new-keep"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span data-i18n="menu.newKeep">New combat (keep allies)</span></button>
        <button class="btn btn-danger" type="button" id="btn-new-all"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="menu.clearAll">Clear everything</span></button>
      </div>
      <p class="hint" data-i18n="menu.undoHint">Both can be reverted with Undo.</p>
    </form>
  </dialog>

  <!-- DIALOG: settings (language, data and backup) -->
  <dialog class="dialog" id="dlg-settings" aria-labelledby="dlg-settings-title">
    <div class="dialog-body">
      <header class="dialog-head">
        <h2 id="dlg-settings-title" data-i18n="settings.title">Settings</h2>
        <button class="btn btn-icon" type="button" data-close data-i18n-aria="common.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>
      <h3><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg> <span data-i18n="settings.language">Language</span></h3>
      <div class="segmented" id="lang-picker" role="radiogroup" data-i18n-aria="settings.language"></div>
      <h3 id="ai-settings"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg> <span data-i18n="ai.connection">Claude (AI)</span></h3>
      <div class="stack" id="ai-settings-body"></div>
      <h3 data-i18n="settings.data">Your data</h3>
      <p data-i18n="settings.dataIntro"></p>
      <div class="stack">
        <button class="btn btn-primary" type="button" id="btn-export"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="settings.export">Export backup</span></button>
        <button class="btn" type="button" id="btn-import"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="settings.import">Import backup</span></button>
        <input type="file" id="file-import" accept=".json,application/json" hidden>
        <button class="btn" type="button" id="btn-install" hidden><svg class="icon" aria-hidden="true"><use href="#i-install"/></svg><span data-i18n="settings.install">Install the app on this device</span></button>
      </div>
      <p class="hint" id="storage-info"></p>
      <h3 data-i18n="settings.credits">Credits</h3>
      <p class="hint" data-i18n="settings.creditsText"></p>
    </div>
  </dialog>

  <!-- DIALOG: confirmation -->
  <dialog class="dialog" id="dlg-confirm" aria-labelledby="dlg-confirm-title">
    <form class="dialog-body" method="dialog">
      <h2 id="dlg-confirm-title"></h2>
      <p id="dlg-confirm-text"></p>
      <footer class="dialog-foot">
        <button class="btn" value="no" data-i18n="common.cancel">Cancel</button>
        <button class="btn btn-danger" value="yes" id="dlg-confirm-yes"></button>
      </footer>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
